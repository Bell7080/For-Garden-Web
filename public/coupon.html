<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>쿠폰 등록 · For Garden</title>
<link rel="stylesheet" href="/ui/controls.css"><link rel="stylesheet" href="/legal/center.css"><script src="/legal/theme.js"></script>
<style>
.cp{max-width:520px;margin:0 auto;padding:28px 16px 64px}
.cp h1{font-size:28px;margin:0 0 4px;letter-spacing:0}
.cp .sub{color:var(--dim);margin:0 0 18px;font-size:15px}
.stage{display:flex;align-items:flex-end;gap:10px;margin:0 0 -6px;position:relative;z-index:1}
.stage img{width:118px;height:auto;flex:none;transform-origin:50% 100%;animation:hop 1.6s ease-in-out .2s 1 both}
.bubble{position:relative;background:var(--panel);border:1px solid var(--line);padding:12px 16px;margin-bottom:56px;font-size:15px;font-weight:700;line-height:1.55;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.bubble:after{content:"";position:absolute;left:-1px;bottom:14px;width:12px;height:12px;background:var(--panel)}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) scaleY(1.04)}55%{transform:translateY(0) scaleY(.96)}70%{transform:translateY(-4px)}}
.card{background:var(--panel);border:1px solid var(--line);padding:20px;position:relative;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);box-shadow:0 6px 0 var(--tint)}
.ticket{display:flex;align-items:center;gap:14px;padding:12px 14px;margin:0 0 18px;background:var(--tint);border-left:4px solid var(--accent)}
.ticket img{width:44px;height:44px;flex:none;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
.who{min-width:0}
.who b{display:block;font-size:18px;font-weight:800;overflow-wrap:anywhere}
.who span{font-size:13px;color:var(--dim);letter-spacing:1px}
label.field{display:grid;gap:6px;font-size:14px;font-weight:700}
.field input{font:inherit;font-size:22px;font-weight:800;letter-spacing:3px;text-transform:uppercase;text-align:center;color:var(--ink);background:var(--bg);border:2px solid var(--line);padding:12px;width:100%;border-radius:0}
.field input:focus{outline:none;border-color:var(--accent)}
.field input[aria-invalid=true]{border-color:#b33b2c}
.note{font-size:13px;color:var(--dim);margin:8px 0 16px}
.go{width:100%;font-size:17px;font-weight:800;padding:14px;background:var(--accent);color:var(--bg);border-color:var(--accent);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.go:hover{background:var(--accent);filter:brightness(1.08)}
.go:disabled{opacity:.55;cursor:wait}
#status{min-height:1.7em;font-size:15px;font-weight:700;margin:12px 0 0;text-align:center}
#status[data-s=error]{color:#b33b2c}html[data-theme=dark] #status[data-s=error]{color:#ffa296}
#status[data-s=ok]{color:#246640}html[data-theme=dark] #status[data-s=ok]{color:#9ad1ac}
.empty{text-align:center}
.empty p{margin:0 0 8px}
.path{display:inline-block;font-weight:800;color:var(--accent);background:var(--tint);padding:4px 10px;margin:6px 0 4px}
.links{font-size:13px;margin-top:20px;color:var(--dim)}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){.stage img,.ticket img{animation:none}}
</style>
</head>
<body>
<main class="cp">
<h1 id="h">쿠폰 등록</h1>
<p class="sub" id="sub">쿠폰 코드만 입력하면 보상이 게임 우편함으로 도착해요.</p>
<div class="stage" aria-hidden="true"><img src="/assets/torika-sd.webp" alt="" width="820" height="1071"><div class="bubble" id="bubble">코드를 입력해 주세요! 보상은 우편함으로 보내 드릴게요.</div></div>
<section class="card">
<div id="form-area" class="hidden">
<div class="ticket"><img src="/assets/game/currency/crystal.webp" alt="" width="256" height="256"><div class="who"><span id="l-acc">등록할 계정</span><b id="nick">…</b><span id="uid"></span></div></div>
<form id="f" novalidate>
<label class="field"><span id="l-code">쿠폰 코드</span><input id="code" name="code" required maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX"></label>
<p class="note" id="note">코드는 계정마다 한 번만 쓸 수 있어요. 보상은 우편함에서 받아 주세요.</p>
<button type="submit" class="go" id="go">등록하기</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
</div>
<div id="empty" class="empty">
<p id="e1">게임에서 열어야 계정이 연결돼요.</p>
<span class="path" id="e2">설정 › 계정 › 쿠폰 등록</span>
<p id="e3" class="note">게임의 「홈페이지에서 등록하기」를 누르면 이 페이지가 계정과 함께 열립니다. 연결은 15분 동안 유지돼요.</p>
<p id="estatus" role="status" aria-live="polite"></p>
</div>
</section>
<p class="links"><a href="/legal/coupon" id="rule">쿠폰 이용 안내</a> · <a href="/" id="back">← 홈으로</a></p>
</main>
<script>
