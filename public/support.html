<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>문의하기 · For Garden</title>
<style>
:root{--bg:#f4f1e8;--ink:#24282e;--muted:#686356;--line:#cec7b7;--accent:#805d24;--card:#fffdf7;--bad:#a33124;--ok:#246640}
@media(prefers-color-scheme:dark){:root{--bg:#1a1d21;--ink:#f2f0ec;--muted:#bdb9ad;--line:#454b54;--accent:#d8b978;--card:#24282e;--bad:#ffa296;--ok:#9ad1ac}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "NEXON Kart",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
form{display:grid;gap:14px;background:var(--card);border:1px solid var(--line);padding:20px}
label{display:grid;gap:6px;font-size:14px;font-weight:700}
input,select,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);padding:10px 12px;border-radius:0;width:100%}
textarea{min-height:160px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.check input{width:auto;margin-top:6px}
button{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#status{min-height:1.7em;font-size:14px}
#status[data-s=error]{color:var(--bad)}#status[data-s=ok]{color:var(--ok)}
a{color:var(--accent)}
</style>
<link rel="stylesheet" href="/ui/controls.css"><link rel="stylesheet" href="/legal/center.css"><script src="/legal/theme.js"></script>
</head>
<body>
<main>
<h1 id="h">문의하기</h1>
<p class="sub" id="sub">문의·버그 제보·신고를 남겨 주세요. 입력한 이메일로 답변드립니다.</p>
<form id="f" novalidate>
<label><span id="l-email">이메일</span><input name="email" type="email" required maxlength="254" autocomplete="email"></label>
<label><span id="l-cat">종류</span>
<select name="category"><option value="inquiry">문의</option><option value="bug">버그 제보</option><option value="report">신고</option><option value="privacy">개인정보·삭제</option><option value="other">기타</option></select></label>
<label><span id="l-subject">제목</span><input name="subject" required maxlength="100"></label>
<label><span id="l-body">내용</span><textarea name="body" required maxlength="4000"></textarea></label>
<div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
<label class="check"><input name="consent" type="checkbox" required><span id="l-consent">답변을 위해 이메일과 문의 내용을 수집·보관하는 데 동의합니다.</span></label>
<p><a href="/legal/support-consent">문의 수집·이용 안내 (출시 준비 초안)</a> · <a href="/privacy">개인정보 처리방침</a></p>
<button type="submit" id="go">보내기</button>
<p id="status" role="status"></p>
</form>
<p class="sub" style="margin-top:20px"><a href="/" id="back">← 홈으로</a></p>
</main>
<script>
(function(){
var T={ko:{},en:{h:"Contact us",sub:"Send an inquiry, bug report or complaint. We will reply by email.","l-email":"Email","l-cat":"Type","l-subject":"Subject","l-body":"Message","l-consent":"I agree to the collection and storage of my email and message for the purpose of replying.",go:"Send",back:"← Home",ok:"Received. Your ticket number is #",bad:"Please check the form.",rate:"Too many requests. Please try again later.",fail:"Could not send. Please try again later.",opts:["Inquiry","Bug report","Report","Privacy / deletion","Other"]},
ja:{h:"お問い合わせ",sub:"お問い合わせ・不具合報告・通報をお送りください。メールで返信します。","l-email":"メールアドレス","l-cat":"種類","l-subject":"件名","l-body":"内容","l-consent":"返信のためにメールアドレスと内容を収集・保管することに同意します。",go:"送信",back:"← ホームへ",ok:"受け付けました。受付番号は #",bad:"入力内容を確認してください。",rate:"送信回数が多すぎます。しばらくしてからお試しください。",fail:"送信できませんでした。後ほどお試しください。",opts:["お問い合わせ","不具合報告","通報","個人情報・削除","その他"]}};
var lang=(navigator.language||"ko").slice(0,2);if(!T[lang])lang="ko";document.documentElement.lang=lang;
var ko={ok:"접수되었습니다. 접수 번호는 #",bad:"입력 내용을 확인해 주세요.",rate:"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.",fail:"전송하지 못했습니다. 잠시 후 다시 시도해 주세요."};
var t=T[lang],m=lang==="ko"?ko:t;
if(lang!=="ko"){["h","sub","go","back"].forEach(function(k){document.getElementById(k).textContent=t[k]});
["l-email","l-cat","l-subject","l-body","l-consent"].forEach(function(k){document.getElementById(k).textContent=t[k]});
[].forEach.call(document.querySelectorAll("option"),function(o,i){o.textContent=t.opts[i]});document.title=t.h+" · For Garden"}
var f=document.getElementById("f"),s=document.getElementById("status"),b=document.getElementById("go");
f.addEventListener("submit",function(e){e.preventDefault();s.dataset.s="";
if(!f.checkValidity()){s.textContent=m.bad;s.dataset.s="error";return}
var d=new FormData(f);b.disabled=true;s.textContent="…";
fetch("/api/support",{method:"POST",headers:{"Content-Type":"application/json"},signal:AbortSignal.timeout(15000),
body:JSON.stringify({email:d.get("email"),category:d.get("category"),subject:d.get("subject"),body:d.get("body"),website:d.get("website"),consent:d.get("consent")==="on"})})
.then(function(r){return r.json().then(function(j){return[r.status,j]})})
.then(function(x){if(x[0]===200&&x[1].ok){s.textContent=m.ok+(x[1].ticket_no||"");s.dataset.s="ok";f.reset()}
else{s.textContent=x[0]===429?m.rate:x[0]===400?m.bad:m.fail;s.dataset.s="error"}})
.catch(function(){s.textContent=m.fail;s.dataset.s="error"})
.then(function(){b.disabled=false})});
})();
</script>
<script type="module" src="/ui/controls.js"></script>
<script defer src="/ui/storage-notice.js"></script>
</body>
</html>
