<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172c25" />
    <meta
      name="description"
      content="잊혀진 생명이 다시 피어나는 곳. 멸종종을 복원한 소녀들과 함께하는 수집형 RPG, For Garden 공식 홈페이지."
    />
    <meta
      property="og:title"
      content="For Garden — 잊혀진 생명이 다시 피어나는 곳"
    />
    <meta
      property="og:description"
      content="이터널 시티에서 당신을 기다립니다. For Garden의 세계와 렐릭을 만나보세요."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/social.jpg" />
    <link rel="stylesheet" href="/ui/footer.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var p = localStorage.getItem("fg-theme");
        document.documentElement.dataset.theme =
          p === "dark" || p === "light"
            ? p
            : matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light";
        document.documentElement.style.colorScheme =
          document.documentElement.dataset.theme;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/ui/controls.css" />
    <title>For Garden — 공식 홈페이지</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/ui/controls.js"></script>
  </body>
</html>
